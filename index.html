<style>
  html,body{margin:0;height:100%;font-family:Georgia,"Times New Roman",serif;background:#f4f1e8}
  #map{position:absolute;inset:0}
  .panel{position:absolute;left:12px;right:12px;bottom:calc(24px + env(safe-area-inset-bottom));max-width:380px;
    background:rgba(250,247,238,.96);border:1px solid #b9ae92;border-radius:10px;padding:12px 14px;
    box-shadow:0 2px 10px rgba(0,0,0,.18);color:#2b2618;z-index:2}

  .end{font-weight:600;color:#4a4333}
  input[type=range]{flex:1;accent-color:#7a5c2e}
  .seg{display:flex;border:1px solid #b9ae92;border-radius:6px;overflow:hidden}
  .seg button{border:0;background:transparent;padding:6px 10px;font:13px system-ui,sans-serif;color:#4a4333;cursor:pointer}
  .seg button.on{background:#7a5c2e;color:#fff}

  .maplibregl-popup-content{font-family:Georgia,serif;font-size:13px;max-width:230px}
  .maplibregl-popup-content b{display:block;margin-bottom:3px}
  .pin{width:14px;height:14px;border-radius:50%;background:#b0412e;border:2px solid #fff;box-shadow:0 0 0 1px #7a2a1d;cursor:pointer}
</style>

<div id="map"></div>

const CORNERS=[[-0.161341, 51.667136], [-0.091344, 51.66737], [-0.091169, 51.638227], [-0.161166, 51.637993]];
const PLACES=[
 {n:"Trent Park House",ll:[-0.1351,51.6601],t:"The 1890s house, before Sir Philip Sassoon re-cased it in brick in the 1920s. Now the museum and the heart of the new development."},
 {n:"West Lodge & gateway",ll:[-0.1516,51.6543],t:"Start of the main drive from Cock Fosters Road. The gateway is still there today."},
 {n:"Fish Pond",ll:[-0.13697,51.66359],t:"The long lake north of the house. Still there as the Trent Park lakes."},
 {n:"Camlet Moat",ll:[-0.1387,51.6679],t:"A medieval moated site in Moat Wood, just off the top edge of this sheet. Legend links it to Geoffrey de Mandeville and Dick Turpin."},
 {n:"Oak Wood",ll:[-0.14753,51.65844],t:"The wood that gave its name to Oakwood station when it opened in 1933."},
 {n:"Cock Fosters",ll:[-0.15597,51.65338],t:"A small hamlet on the edge of Enfield Chase in 1897, with Christ Church and a school."},
 {n:"Merryhills Brook",ll:[-0.12126,51.65575],t:"Ran through open fields in 1897. Today it's lined by the Merryhills Way footpath through Oakwood."},
 {n:"Northern Hospital",ll:[-0.11527,51.64662],t:"A fever convalescent hospital, later Highlands Hospital. Now Highlands Village."}
];
const BASES={
 street:{tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}"],attr:"Map © Esri, HERE, Garmin, © OpenStreetMap contributors",max:19},
 sat:{tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],attr:"Imagery © Esri",max:19}
};
const map=new maplibregl.Map({container:"map",
 style:{version:8,sources:{
   street:{type:"raster",tiles:["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],tileSize:256,attribution:"© OpenStreetMap contributors",maxzoom:19},
   roads:{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}"],tileSize:256,maxzoom:19},
   names:{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"],tileSize:256,maxzoom:19},
   sat:{type:"raster",tiles:BASES.sat.tiles,tileSize:256,attribution:BASES.sat.attr,maxzoom:19},
   old:{type:"image",url:IMG,coordinates:CORNERS}},
  layers:[
   {id:"street",type:"raster",source:"street"},
   {id:"sat",type:"raster",source:"sat",layout:{visibility:"none"}},
   {id:"roads",type:"raster",source:"roads",layout:{visibility:"none"}},
   {id:"names",type:"raster",source:"names",layout:{visibility:"none"}},
   {id:"old",type:"raster",source:"old",paint:{"raster-opacity":0.75,"raster-fade-duration":0}}]},
 bounds:[[CORNERS[0][0],CORNERS[2][1]],[CORNERS[2][0],CORNERS[0][1]]],
 fitBoundsOptions:{padding:20}, maxZoom:18, attributionControl:{compact:true}});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
const op=document.getElementById("op");
op.oninput=()=>{map.setPaintProperty("old","raster-opacity",1-op.value/100);};
function base(which){const sat=which==="sat";
  map.setLayoutProperty("street","visibility",sat?"none":"visible");
  ["sat","roads","names"].forEach(id=>map.setLayoutProperty(id,"visibility",sat?"visible":"none"));
  document.getElementById("b-street").classList.toggle("on",!sat);
  document.getElementById("b-sat").classList.toggle("on",sat);}
document.getElementById("b-street").onclick=()=>base("street");
document.getElementById("b-sat").onclick=()=>base("sat");
const markers=PLACES.map(p=>{const el=document.createElement("div");el.className="pin";el.title=p.n;
  return new maplibregl.Marker({element:el}).setLngLat(p.ll)
   .setPopup(new maplibregl.Popup({offset:10}).setHTML("<b>"+p.n+"</b>"+p.t)).addTo(map);});
let pinsOn=true;
document.getElementById("b-pins").onclick=e=>{pinsOn=!pinsOn;e.target.classList.toggle("on",pinsOn);
  markers.forEach(m=>pinsOn?m.addTo(map):m.remove());};
</script>
